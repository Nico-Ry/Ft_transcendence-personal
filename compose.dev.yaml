# ── Docker Services ──────────────────────────────────────────────────────────
services:
  # ── Frontend (React) ─────────────────────────────────────────────
  frontend:
    container_name: dev-frontend
    build:
      target: dev
    volumes:
      - ./frontend:/app                         # reflect host changes instantly
      - frontend_node_modules:/app/node_modules # prevent node_module overwrite in container
    environment:
      - VITE_OAUTH_42_START_URL=${VITE_OAUTH_42_START_URL}


  # ── Backend (Nest.js) ────────────────────────────────────────────
  backend:
    container_name: dev-backend
    build:
      target: dev
    ports:
      - "5555:5555"
    environment:
      - CORS_ORIGINS=http://localhost:1024,http://${DOMAIN}:1024
    volumes:
      - ./backend:/app                          # reflect host changes instantly
      - backend_node_modules:/app/node_modules  # prevent node_module overwrite in container

  # ── Reverse Proxy (Nginx) ────────────────────────────────────────
  proxy:
    container_name: dev-proxy
    build:
      target: dev
    ports:
      - "1024:80"

  # ── Database (Postgres) ──────────────────────────────────────────
  db:
    container_name: dev-db

  prometheus:
    image: prom/prometheus:latest
    container_name: dev-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - client-side
    depends_on:
      - proxy

  grafana:
    image: grafana/grafana-oss:latest
    container_name: dev-grafana
    ports:
      - "3001:3000"
    networks:
      - client-side
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

# ── Docker Volumes ──────────────────────────────────────────────────────────
volumes:
  frontend_node_modules:
  backend_node_modules:
  grafana_data:
